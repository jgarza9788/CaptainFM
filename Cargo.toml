[package]
name = "captainfm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A fast, keyboard-first file manager for Omarchy and Hyprland"
repository = "https://github.com/jgarza9788/CaptainFM"

[features]
# Plugins that ship inside the app. Leave some out with e.g.
#   cargo build --no-default-features --features plugin-torrent,plugin-sqlite
# (build.sh has --without and --only for this). Whatever is built in can still be switched off at run time.
default = ["bundled-plugins"]
bundled-plugins = ["plugin-torrent", "plugin-calendar-contacts", "plugin-sqlite", "plugin-system", "plugin-documents"]
plugin-torrent = []
plugin-calendar-contacts = []
plugin-sqlite = []
plugin-system = []
plugin-documents = []

[dependencies]
blocking = "1.7.0"
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["full"] }
libc = "0.2.191"
md-5 = "0.11.0"
mlua = { version = "0.12.2", features = ["lua54", "vendored", "serialize"] }
notify = "8"
regex = "1.13.1"
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
walkdir = "2.5.0"
zbus = "5"

[build-dependencies]
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }

[profile.release]
strip = true

# What build.sh installs: slower to build (about 6 minutes), 19% smaller. Plain `cargo build --release` stays quick for development.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
